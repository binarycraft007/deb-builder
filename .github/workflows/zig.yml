name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test

  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - riscv64-linux-musl
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build binary
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Package tarball
        run: |
          mkdir -p dist package_staging/deb-builder-${{ matrix.target }}
          cp zig-out/bin/deb-builder package_staging/deb-builder-${{ matrix.target }}/
          [ -f README.md ] && cp README.md package_staging/deb-builder-${{ matrix.target }}/
          [ -f LICENSE ] && cp LICENSE package_staging/deb-builder-${{ matrix.target }}/
          tar -czf dist/deb-builder-${{ matrix.target }}.tar.gz -C package_staging deb-builder-${{ matrix.target }}
          cd dist
          sha256sum deb-builder-${{ matrix.target }}.tar.gz > deb-builder-${{ matrix.target }}.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-builder-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
